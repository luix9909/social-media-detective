version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: social-detective-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - social-detective-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: social-detective-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - social-detective-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: social-detective-app
    ports:
      - "5000:5000"
      - "3000:3000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:password@mongodb:27017/social-media-detective?authSource=admin
      REDIS_URL: redis://redis:6379
      PORT: 5000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - social-detective-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: social-detective-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - social-detective-network
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:

networks:
  social-detective-network:
    driver: bridge
